<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifikasi Pesanan - 𝐒𝐰𝐞𝐞𝐭𝐁𝐢𝐭𝐞</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff8f5;
      color: #3f302e;
    }

    header {
      background: #fff;
      padding: 20px;
      border-bottom: 1px solid #f0ded8;
    }

    header h1 {
      margin: 0 0 6px;
      color: #9d4b56;
    }

    header p {
      margin: 0;
      color: #806c68;
    }

    main {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card,
    .toolbar,
    .order-card {
      background: white;
      border: 1px solid #f0ded8;
      border-radius: 12px;
      padding: 16px;
    }

    .stat-card span {
      display: block;
      color: #806c68;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .stat-card strong {
      font-size: 24px;
      color: #9d4b56;
    }

    .toolbar {
      margin-bottom: 20px;
    }

    .toolbar input {
      width: 100%;
      padding: 12px;
      border: 1px solid #e4c9c1;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .filter-bar,
    .order-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 13px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .filter-button {
      background: #f7e9e5;
      color: #75444b;
    }

    .filter-button.active,
    .btn-primary {
      background: #9d4b56;
      color: white;
    }

    .btn-secondary {
      background: #f5e7e3;
      color: #79464d;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .order-header h3 {
      margin: 0 0 6px;
    }

    .muted {
      color: #806c68;
      font-size: 13px;
    }

    .status {
      display: inline-block;
      padding: 7px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      height: fit-content;
    }

    .status.pending {
      background: #fff1c9;
      color: #805d12;
    }

    .status.processing {
      background: #dff4e5;
      color: #236b3b;
    }

    .status.delivering {
      background: #dcecff;
      color: #245b91;
    }

    .status.cancelled {
      background: #fbe1e1;
      color: #a52b2b;
    }

    .status.neutral {
      background: #eee9e7;
      color: #665653;
    }

    .order-items {
      border-top: 1px solid #f0e6e2;
      border-bottom: 1px solid #f0e6e2;
      padding: 12px 0;
      margin: 12px 0;
      white-space: pre-line;
    }

    .order-info {
      display: grid;
      gap: 7px;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .order-actions {
      margin-top: 16px;
    }

    .notice {
      display: none;
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .notice.show {
      display: block;
    }

    .notice.info {
      background: #e5f3e8;
      color: #245f36;
    }

    .notice.error {
      background: #fde6e6;
      color: #992d2d;
    }

    .empty-state {
      background: white;
      padding: 32px 16px;
      text-align: center;
      border-radius: 12px;
      border: 1px solid #f0ded8;
      color: #806c68;
      line-height: 1.6;
    }

    .refresh-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .orders {
      display: grid;
      gap: 16px;
    }

    @media (max-width: 600px) {
      main {
        margin-top: 16px;
      }

      .order-actions button {
        width: 100%;
      }

      .filter-bar button {
        flex: 1 1 auto;
      }
    }

    .product-list {
  display: grid;
  gap: 10px;
  margin-top: 10px;
}

.product-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.product-image {
  width: 72px;
  height: 72px;
  object-fit: cover;
  border-radius: 10px;
  background: #fff8f5;
  border: 1px solid #f0ded8;
  flex-shrink: 0;
}

.product-image-placeholder {
  width: 72px;
  height: 72px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: #fff8f5;
  flex-shrink: 0;
  font-size: 26px;
}

.product-details {
  min-width: 0;
  display: grid;
  gap: 4px;
}

.product-name {
  font-weight: 700;
  overflow-wrap: anywhere;
}

.product-meta {
  color: #806c68;
  font-size: 13px;
  }
  </style>
</head>

<body>
  <header>
    <h1>Notifikasi Pesanan</h1>
    <p>Kelola pesanan pelanggan 𝐒𝐰𝐞𝐞𝐭𝐁𝐢𝐭𝐞.</p>
  </header>

  <main>
    <div id="notice" class="notice" role="status"></div>

    <section class="stats">
      <div class="stat-card">
        <span>Total Pesanan</span>
        <strong id="totalOrders">0</strong>
      </div>

      <div class="stat-card">
        <span>Menunggu Pembayaran</span>
        <strong id="waitingPayment">0</strong>
      </div>

      <div class="stat-card">
        <span>Menunggu Verifikasi</span>
        <strong id="waitingVerification">0</strong>
      </div>

      <div class="stat-card">
        <span>Sedang Dibuat</span>
        <strong id="processingOrders">0</strong>
      </div>

      <div class="stat-card">
        <span>Sedang Diantar</span>
        <strong id="deliveringOrders">0</strong>
      </div>

      <div class="stat-card">
        <span>Selesai</span>
        <strong id="completedOrders">0</strong>
      </div>
    </section>

    <section class="toolbar">
      <input
        id="searchInput"
        type="search"
        placeholder="Cari nomor pesanan atau nama pelanggan..."
        autocomplete="off"
      >

      <div class="filter-bar">
        <button class="filter-button active" data-filter="all" type="button">
          Semua
        </button>

        <button class="filter-button" data-filter="pending_payment" type="button">
          Menunggu Pembayaran
        </button>

        <button class="filter-button" data-filter="awaiting_verification" type="button">
          Menunggu Verifikasi
        </button>

        <button class="filter-button" data-filter="processing" type="button">
          Sedang Dibuat
        </button>

        <button class="filter-button" data-filter="delivering" type="button">
          Sedang Diantar
        </button>

        <button class="filter-button" data-filter="completed" type="button">
          Selesai
        </button>

        <button class="filter-button" data-filter="cancelled" type="button">
          Ditolak / Dibatalkan
        </button>
      </div>
    </section>

    <div class="refresh-row">
      <span id="lastUpdated" class="muted">Belum memuat pesanan</span>
      <button id="refreshButton" class="btn-primary" type="button">
        ↻ Muat Ulang
      </button>
    </div>

    <section id="ordersContainer" class="orders">
      <div class="empty-state">Memuat pesanan...</div>
    </section>
  </main>

  <script>
    "use strict";

    const API_BASE =
      "https://cake-order-backend.sabrinaayukartika.workers.dev";

    const TOKEN_KEY = "cake_order_cashier_token";
    const DELIVERY_KEY = "cake_order_delivery_statuses";

    let orders = [];
    let activeFilter = "all";
    let searchQuery = "";
    let isLoading = false;

    function getToken() {
      return sessionStorage.getItem(TOKEN_KEY) || "";
    }

    function orderId(order) {
      return order.id ??
        order.order_id ??
        order.orderId ??
        "";
    }

    function orderNumber(order) {
      return order.order_number ??
        order.orderNumber ??
        order.order_code ??
        order.code ??
        order.id ??
        "-";
    }

    function paymentStatus(order) {
      return order.payment_status ??
        order.paymentStatus ??
        "unknown";
    }

    function getDeliveryStatuses() {
      try {
        const value = sessionStorage.getItem(DELIVERY_KEY);
        const parsed = value ? JSON.parse(value) : {};

        return parsed && typeof parsed === "object" &&
          !Array.isArray(parsed)
          ? parsed
          : {};
      } catch {
        return {};
      }
    }

    function saveDeliveryStatuses(statuses) {
      sessionStorage.setItem(
        DELIVERY_KEY,
        JSON.stringify(statuses)
      );
    }

    function orderStatus(order) {
      // Jika API menyediakan status tampilan, gunakan status tersebut.
      if (order.display_status) {
        return order.display_status;
      }

      const id = String(orderId(order));
      const deliveryStatuses = getDeliveryStatuses();

      // Backend tetap menyimpan processing saat sedang diantar.
      if (
        deliveryStatuses[id] === "delivering" &&
        order.order_status === "processing" &&
        paymentStatus(order) === "paid"
      ) {
        return "delivering";
      }

      return order.order_status ??
        order.orderStatus ??
        order.status ??
        "unknown";
    }

    function customerName(order) {
      return order.customer_name ??
        order.customerName ??
        order.name ??
        order.customer?.name ??
        "Pelanggan";
    }

    function customerPhone(order) {
      return order.customer_phone ??
        order.customerPhone ??
        order.phone ??
        order.customer?.phone ??
        "-";
    }

    function customerAddress(order) {
      return order.delivery_address ??
        order.customer_address ??
        order.customerAddress ??
        order.address ??
        order.customer?.address ??
        "-";
    }

    function orderTotal(order) {
      return Number(
        order.total_amount ??
        order.total_price ??
        order.totalPrice ??
        order.total ??
        0
      );
    }

    function createdAt(order) {
      return order.created_at ??
        order.createdAt ??
        order.order_date ??
        "";
    }

    function formatRupiah(amount) {
      return new Intl.NumberFormat("id-ID", {
        style: "currency",
        currency: "IDR",
        maximumFractionDigits: 0
      }).format(Number(amount) || 0);
    }

    function formatDate(value) {
      if (!value) return "-";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return String(value);
      }

      return date.toLocaleString("id-ID", {
        dateStyle: "medium",
        timeStyle: "short"
      });
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function statusLabel(status) {
      const labels = {
        pending_payment: "Menunggu Pembayaran",
        awaiting_verification: "Menunggu Verifikasi",
        processing: "Sedang Dibuat",
        delivering: "Sedang Diantar",
        completed: "Pesanan Selesai",
        cancelled: "Ditolak / Dibatalkan"
      };

      return labels[status] || status || "Tidak diketahui";
    }

    function paymentLabel(status) {
      const labels = {
        unpaid: "Belum Dibayar",
        reported_paid: "Menunggu Verifikasi",
        paid: "Sudah Dibayar",
        failed: "Gagal / Ditolak",
        refunded: "Dikembalikan"
      };

      return labels[status] || status || "Tidak diketahui";
    }

    function statusClass(status) {
      if (status === "completed") return "processing";
      if (status === "delivering") return "delivering";
      if (status === "processing") return "processing";

      if (
        status === "awaiting_verification" ||
        status === "pending_payment"
      ) {
        return "pending";
      }

      if (status === "cancelled") return "cancelled";

      return "neutral";
    }

    function showNotice(message, type = "info") {
      const notice = document.getElementById("notice");

      notice.textContent = message;
      notice.className = `notice show ${type}`;

      window.setTimeout(() => {
        notice.classList.remove("show");
      }, 5000);
    }

    function extractOrders(data) {
      if (Array.isArray(data)) return data;
      if (Array.isArray(data?.orders)) return data.orders;
      if (Array.isArray(data?.data?.orders)) return data.data.orders;
      if (Array.isArray(data?.data)) return data.data;
      if (Array.isArray(data?.results)) return data.results;

      return [];
    }

    async function apiRequest(path, options = {}) {
      const token = getToken();

      if (!token) {
        throw new Error(
          "Sesi kasir tidak ditemukan. Silakan login kembali."
        );
      }

      const response = await fetch(`${API_BASE}${path}`, {
        ...options,
        headers: {
          "Authorization": `Bearer ${token}`,
          "Content-Type": "application/json",
          "Accept": "application/json",
          ...(options.headers || {})
        }
      });

      const raw = await response.text();
      let data = {};

      try {
        data = raw ? JSON.parse(raw) : {};
      } catch {
        data = { message: raw.slice(0, 300) };
      }

      if (!response.ok) {
        throw new Error(
          `${data.message || data.error || "Permintaan gagal"} [HTTP ${response.status}]`
        );
      }

      if (data?.success === false) {
        throw new Error(data.message || "Permintaan tidak berhasil.");
      }

      return data;
    }

        async function loadOrders() {
      if (isLoading) return;

      isLoading = true;

      const refreshButton = document.getElementById("refreshButton");
      refreshButton.disabled = true;
      refreshButton.textContent = "Memuat...";

      try {
        const data = await apiRequest("/api/cashier/orders");
        orders = extractOrders(data);

        // Hapus status pengantaran lokal jika pesanan sudah selesai,
        // dibatalkan, atau tidak lagi memenuhi kondisi pengantaran.
        const deliveryStatuses = getDeliveryStatuses();

        for (const order of orders) {
          const id = String(orderId(order));

          if (
            order.order_status === "completed" ||
            order.order_status === "cancelled" ||
            (
              order.order_status !== "processing" &&
              order.order_status !== "delivering"
            ) ||
            paymentStatus(order) !== "paid"
          ) {
            delete deliveryStatuses[id];
          }
        }

        saveDeliveryStatuses(deliveryStatuses);

        updateStats();
        renderOrders();

        document.getElementById("lastUpdated").textContent =
          `Terakhir diperbarui: ${new Date().toLocaleTimeString("id-ID")}`;
      } catch (error) {
        showNotice(error.message || "Gagal memuat pesanan.", "error");

        if (orders.length === 0) {
          document.getElementById("ordersContainer").innerHTML = `
            <div class="empty-state">
              Pesanan belum dapat dimuat.<br>
              Periksa koneksi atau sesi login kasir.
            </div>
          `;
        }
      } finally {
        isLoading = false;
        refreshButton.disabled = false;
        refreshButton.textContent = "↻ Muat Ulang";
      }
    }

    function updateStats() {
      const count = status =>
        orders.filter(order => orderStatus(order) === status).length;

      document.getElementById("totalOrders").textContent = orders.length;
      document.getElementById("waitingPayment").textContent =
        count("pending_payment");
      document.getElementById("waitingVerification").textContent =
        count("awaiting_verification");
      document.getElementById("processingOrders").textContent =
        count("processing");
      document.getElementById("deliveringOrders").textContent =
        count("delivering");
      document.getElementById("completedOrders").textContent =
        count("completed");
    }

    function getFilteredOrders() {
      return orders.filter(order => {
        const status = orderStatus(order);

        const matchesFilter =
          activeFilter === "all" || status === activeFilter;

        const searchableText = [
          orderNumber(order),
          customerName(order),
          customerPhone(order),
          orderId(order)
        ].join(" ").toLowerCase();

        const matchesSearch =
          searchableText.includes(searchQuery.toLowerCase());

        return matchesFilter && matchesSearch;
      });
    }

    function renderOrders() {
      const container = document.getElementById("ordersContainer");
      const filteredOrders = getFilteredOrders();

      if (filteredOrders.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            Tidak ada pesanan yang cocok dengan filter ini.
          </div>
        `;
        return;
      }

      container.innerHTML = filteredOrders.map(order => {
        const id = orderId(order);
        const status = orderStatus(order);
        const payment = paymentStatus(order);

        const canVerify =
          status === "awaiting_verification" &&
          payment === "reported_paid";

        const canReject = canVerify;

        const canCancel =
          status === "pending_payment" &&
          payment === "unpaid";

        const canDeliver =
          status === "processing" &&
          payment === "paid";

        const canComplete =
          status === "delivering" &&
          payment === "paid";

        const items = order.items ??
          order.order_items ??
          order.products ??
          [];

        
const itemsHTML =
  Array.isArray(items) && items.length
    ? `<div class="product-list">${
        items.map(item => {
          const name =
            item.product_name ?? item.name ?? item.title ?? "Produk";

          const quantity = Number(item.quantity ?? item.qty ?? 1);
          const price = Number(item.unit_price ?? item.price ?? 0);

          // Dukung URL gambar dan data gambar Base64.
          let image = item.image_url ?? item.image_data ?? "";

          if (
            typeof image === "string" &&
            image &&
            !image.startsWith("data:") &&
            !/^https?:\/\//i.test(image)
          ) {
            image = "";
          }

          const safeImage = escapeHTML(image);

          return `
  <div class="product-row">
    ${
      safeImage
        ? `<img
             class="product-image"
             src="${safeImage}"
             alt="${escapeHTML(name)}"
             loading="lazy"
             onerror="this.hidden=true;this.nextElementSibling.hidden=false"
           >
           <div class="product-image-placeholder" hidden>🍰</div>`
        : `<div class="product-image-placeholder">🍰</div>`
    }

    <div class="product-details">
      <div class="product-name">${escapeHTML(name)}</div>
      <div class="product-meta">
        ${escapeHTML(quantity)} × ${escapeHTML(formatRupiah(price))}
      </div>
    </div>
  </div>
`;
        }).join("")
      }</div>`
    : "Detail produk tidak tersedia";

        const rejectionReason = order.rejection_reason
          ? `
            <div>
              <strong>Alasan penolakan:</strong>
              ${escapeHTML(order.rejection_reason)}
            </div>
          `
          : "";

        return `
          <article class="order-card">
            <div class="order-header">
              <div>
                <h3>Pesanan #${escapeHTML(orderNumber(order))}</h3>
                <div class="muted">
                  ${escapeHTML(formatDate(createdAt(order)))}
                </div>
              </div>

              <span class="status ${statusClass(status)}">
                ${escapeHTML(statusLabel(status))}
              </span>
            </div>

            <div class="order-info">
              <div>
                <strong>Nama:</strong>
                ${escapeHTML(customerName(order))}
              </div>

              <div>
                <strong>No. HP:</strong>
                ${escapeHTML(customerPhone(order))}
              </div>

              <div>
                <strong>Alamat:</strong>
                ${escapeHTML(customerAddress(order))}
              </div>

              <div>
                <strong>Pembayaran:</strong>
                ${escapeHTML(paymentLabel(payment))}
              </div>

              ${rejectionReason}
            </div>

            <div class="order-items">
              <strong>Produk:</strong>
              <div>${itemsHTML}</div>
            </div>

            <div>
              <strong>
                Total: ${escapeHTML(formatRupiah(orderTotal(order)))}
              </strong>
            </div>

            <div class="order-actions">
              ${
                canVerify
                  ? `<button class="btn-primary verify-button"
                       data-id="${escapeHTML(id)}" type="button">
                       ✓ Verifikasi Pembayaran
                     </button>`
                  : ""
              }

              ${
                canReject
                  ? `<button class="btn-secondary reject-button"
                       data-id="${escapeHTML(id)}" type="button">
                       ✕ Tolak Pesanan
                     </button>`
                  : ""
              }

              ${
                canCancel
                  ? `<button class="btn-secondary cancel-order-button"
                       data-id="${escapeHTML(id)}" type="button">
                       ✕ Batalkan Pesanan
                     </button>`
                  : ""
              }

              ${
                canDeliver
                  ? `<button class="btn-primary deliver-button"
                       data-id="${escapeHTML(id)}" type="button">
                       🛵 Mulai Pengantaran
                     </button>`
                  : ""
              }

              ${
                canComplete
                  ? `<button class="btn-primary complete-button"
                       data-id="${escapeHTML(id)}" type="button">
                       ✓ Pesanan Selesai
                     </button>`
                  : ""
              }
              ${["completed", "cancelled"].includes(order.order_status) ? `
  <button
    class="btn-secondary"
    type="button"
    data-delete-order="${escapeHTML(id)}"
  >
    🗑️ Hapus Riwayat
  </button>
` : ""}
            </div>
          </article>
        `;
      }).join("");

      attachOrderListeners();
    }

    function attachOrderListeners() {
      document.querySelectorAll(".verify-button").forEach(button => {
        button.addEventListener("click", () => {
          verifyOrder(button.dataset.id, button);
        });
      });

      document.querySelectorAll(".reject-button").forEach(button => {
        button.addEventListener("click", () => {
          rejectOrder(button.dataset.id, button);
        });
      });

      document.querySelectorAll(".cancel-order-button").forEach(button => {
        button.addEventListener("click", () => {
          cancelOrder(button.dataset.id, button);
        });
      });

      document.querySelectorAll(".deliver-button").forEach(button => {
        button.addEventListener("click", () => {
          updateOrderStatus(button.dataset.id, "delivering", button);
        });
      });

      document.querySelectorAll(".complete-button").forEach(button => {
        button.addEventListener("click", () => {
          updateOrderStatus(button.dataset.id, "completed", button);
        });
      });
    }

        async function verifyOrder(id, button) {
      const order = orders.find(
        item => String(orderId(item)) === String(id)
      );

      if (
        !order ||
        orderStatus(order) !== "awaiting_verification" ||
        paymentStatus(order) !== "reported_paid"
      ) {
        showNotice(
          "Pesanan tidak memenuhi syarat untuk diverifikasi.",
          "error"
        );
        return;
      }

      if (!confirm("Verifikasi pembayaran pesanan ini?")) return;

      await runOrderAction(
        button,
        "Memverifikasi...",
        async () => {
          const data = await apiRequest(
            `/api/cashier/orders/${encodeURIComponent(id)}/verify`,
            {
              method: "PATCH",
              body: JSON.stringify({})
            }
          );

          showNotice(data.message || "Pembayaran berhasil diverifikasi.");
          await loadOrders();
        },
        "✓ Verifikasi Pembayaran"
      );
    }

    async function rejectOrder(id, button) {
      const order = orders.find(
        item => String(orderId(item)) === String(id)
      );

      if (
        !order ||
        orderStatus(order) !== "awaiting_verification" ||
        paymentStatus(order) !== "reported_paid"
      ) {
        showNotice(
          "Pesanan tidak memenuhi syarat untuk ditolak.",
          "error"
        );
        return;
      }

      const reason = prompt(
        `Masukkan alasan penolakan pesanan #${orderNumber(order)}:`
      );

      if (reason === null) return;

      if (reason.trim().length < 3 || reason.trim().length > 500) {
        showNotice(
          "Alasan penolakan harus 3–500 karakter.",
          "error"
        );
        return;
      }

      if (
        !confirm(
          "Yakin ingin menolak pesanan ini? Stok akan dikembalikan."
        )
      ) {
        return;
      }

      await runOrderAction(
        button,
        "Menolak...",
        async () => {
          const data = await apiRequest(
            `/api/cashier/orders/${encodeURIComponent(id)}/reject`,
            {
              method: "PATCH",
              body: JSON.stringify({ reason: reason.trim() })
            }
          );

          showNotice(data.message || "Pesanan berhasil ditolak.");
          await loadOrders();
        },
        "✕ Tolak Pesanan"
      );
    }

    async function cancelOrder(id, button) {
      const order = orders.find(
        item => String(orderId(item)) === String(id)
      );

      if (
        !order ||
        orderStatus(order) !== "pending_payment" ||
        paymentStatus(order) !== "unpaid"
      ) {
        showNotice(
          "Pesanan ini tidak dapat dibatalkan dari halaman ini.",
          "error"
        );
        return;
      }

      if (!confirm("Yakin ingin membatalkan pesanan ini?")) return;

      await runOrderAction(
        button,
        "Membatalkan...",
        async () => {
          const data = await apiRequest(
            `/api/cashier/orders/${encodeURIComponent(id)}/cancel`,
            {
              method: "POST",
              body: JSON.stringify({})
            }
          );

          showNotice(data.message || "Pesanan berhasil dibatalkan.");
          await loadOrders();
        },
        "✕ Batalkan Pesanan"
      );
    }

    async function updateOrderStatus(id, newStatus, button) {
      const order = orders.find(
        item => String(orderId(item)) === String(id)
      );

      const currentStatus = order ? orderStatus(order) : "";

      const transitions = {
        delivering: {
          from: "processing",
          confirm: "Mulai pengantaran pesanan ini?",
          buttonLabel: "🛵 Mulai Pengantaran"
        },
        completed: {
          from: "delivering",
          confirm: "Konfirmasi pesanan sudah selesai diantar?",
          buttonLabel: "✓ Pesanan Selesai"
        }
      };

      const transition = transitions[newStatus];

      if (
        !order ||
        !transition ||
        currentStatus !== transition.from ||
        paymentStatus(order) !== "paid"
      ) {
        showNotice(
          "Status pesanan tidak sesuai untuk tindakan ini.",
          "error"
        );
        return;
      }

      if (!confirm(transition.confirm)) return;

      await runOrderAction(
        button,
        "Memperbarui...",
        async () => {
          const data = await apiRequest(
            `/api/cashier/orders/${encodeURIComponent(id)}/status`,
            {
              method: "PATCH",
              body: JSON.stringify({
                order_status: newStatus
              })
            }
          );

          const deliveryStatuses = getDeliveryStatuses();

          if (newStatus === "delivering") {
            // Backend menyimpan processing, browser kasir
            // menyimpan status tampilan delivering.
            deliveryStatuses[String(id)] = "delivering";
          } else {
            // Status completed disimpan oleh backend.
            delete deliveryStatuses[String(id)];
          }

          saveDeliveryStatuses(deliveryStatuses);

          showNotice(data.message || "Status berhasil diperbarui.");
          await loadOrders();
        },
        transition.buttonLabel
      );
    }

    async function runOrderAction(
      button,
      loadingText,
      action,
      originalText
    ) {
      button.disabled = true;
      button.textContent = loadingText;

      try {
        await action();
      } catch (error) {
        showNotice(
          error.message || "Tindakan gagal dilakukan.",
          "error"
        );

        button.disabled = false;
        button.textContent = originalText;
      }
    }

    // Pencarian pesanan.
    document.getElementById("searchInput").addEventListener(
      "input",
      event => {
        searchQuery = event.target.value.trim();
        renderOrders();
      }
    );

    // Filter status.
    document.querySelectorAll("[data-filter]").forEach(button => {
      button.addEventListener("click", () => {
        activeFilter = button.dataset.filter;

        document.querySelectorAll("[data-filter]").forEach(item => {
          item.classList.toggle("active", item === button);
        });

        renderOrders();
      });
    });

    // Tombol muat ulang.
    document.getElementById("refreshButton").addEventListener(
      "click",
      () => {
        loadOrders();
      }
    );

    // Muat pesanan saat halaman dibuka.
    loadOrders();

    // Perbarui daftar pesanan setiap 10 detik.
    window.setInterval(() => {
      if (!document.hidden) {
        loadOrders();
      }
    }, 10000);

    async function deleteOrderHistory(id) {
  const confirmed = confirm(
    "Yakin ingin menghapus riwayat pesanan ini secara permanen?"
  );

  if (!confirmed) return;

  try {
    const result = await apiRequest(
      `/api/cashier/orders/${encodeURIComponent(id)}`,
      { method: "DELETE" }
    );

    showNotice(
      result.message || "Riwayat pesanan berhasil dihapus."
    );

    await loadOrders();
  } catch (error) {
    showNotice(
      error.message || "Gagal menghapus riwayat pesanan."
    );
  }
        }
  </script>
</body>
