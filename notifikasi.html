
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifikasi Kasir | Cake Order</title>

  <style>
    :root {
      --cream: #F3E0D2;
      --white: #FFFAF7;
      --pink: #F8E7E4;
      --pink-dark: #DD9BA7;
      --maroon: #A0233D;
      --maroon-dark: #7D1B30;
      --text: #48272E;
      --muted: #86656A;
      --border: #EBD5D1;
      --green: #287A51;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--white);
      color: var(--text);
    }

    header {
      background: var(--cream);
      border-bottom: 1px solid var(--border);
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      font-family: Georgia, serif;
      font-size: 25px;
      font-weight: bold;
      color: var(--maroon);
    }

    .tagline {
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px;
    }

    .back-link {
      color: var(--maroon);
      text-decoration: none;
      font-weight: bold;
    }

    main {
      width: min(900px, 92%);
      margin: 35px auto;
    }

    .page-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    h1 {
      font-family: Georgia, serif;
      color: var(--maroon);
      margin: 0 0 8px;
      font-size: 30px;
    }

    .subtitle {
      color: var(--muted);
      margin: 0;
      line-height: 1.5;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 36px;
      height: 36px;
      padding: 0 12px;
      border-radius: 20px;
      background: var(--maroon);
      color: white;
      font-weight: bold;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    button {
      font: inherit;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      font-weight: bold;
    }

    .primary {
      color: white;
      background: var(--maroon);
    }

    .primary:hover {
      background: var(--maroon-dark);
    }

    .secondary {
      color: var(--maroon);
      background: var(--pink);
    }

    .notification-list {
      display: grid;
      gap: 14px;
    }

    .notification {
      background: white;
      border: 1px solid var(--border);
      border-left: 5px solid var(--pink-dark);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 5px 18px rgba(125, 27, 48, 0.05);
    }

    .notification.unread {
      border-left-color: var(--maroon);
      background: #FFFCFB;
    }

    .notification-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .order-code {
      color: var(--maroon);
      font-size: 17px;
      font-weight: bold;
    }

    .status {
      display: inline-block;
      border-radius: 20px;
      padding: 5px 10px;
      background: var(--pink);
      color: var(--maroon);
      font-size: 12px;
      font-weight: bold;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 14px 0;
    }

    .detail-label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .detail-value {
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .notification-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      border-top: 1px solid var(--border);
      padding-top: 13px;
      margin-top: 12px;
    }

    .time {
      color: var(--muted);
      font-size: 12px;
    }

    .empty, .message {
      text-align: center;
      padding: 35px 20px;
      border: 1px dashed var(--border);
      border-radius: 14px;
      background: white;
      color: var(--muted);
      line-height: 1.6;
    }

    .login-card {
      max-width: 420px;
      margin: 45px auto;
      padding: 25px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(125, 27, 48, 0.06);
    }

    .login-card h2 {
      color: var(--maroon);
      font-family: Georgia, serif;
      margin-top: 0;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      font: inherit;
      background: var(--white);
    }

    .login-card button {
      width: 100%;
      margin-top: 20px;
    }

    .error {
      color: var(--maroon);
      font-size: 14px;
      margin-top: 12px;
      line-height: 1.5;
    }

    .small {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 520px) {
      main {
        margin-top: 25px;
      }

      h1 {
        font-size: 25px;
      }

      .details {
        grid-template-columns: 1fr;
      }

      .notification {
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div>
      <div class="brand">Cake Order</div>
      <div class="tagline">Sweet Moment, Better Together</div>
    </div>

    <a class="back-link" href="./home.html">← Kembali ke Beranda</a>
  </header>

  <main>
    <section id="loginSection" class="login-card">
      <h2>Login Kasir</h2>
      <p class="subtitle">Login untuk melihat notifikasi pesanan yang masuk.</p>

      <form id="loginForm">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" required>

        <button class="primary" type="submit">Login</button>
        <p id="loginError" class="error" role="alert"></p>
      </form>
    </section>

    <section id="notificationSection" hidden>
      <div class="page-heading">
        <div>
          <h1>🔔 Notifikasi Pesanan</h1>
          <p class="subtitle">
            Pantau pesanan baru yang masuk ke Cake Order.
          </p>
        </div>

        <div>
          <span class="badge" id="unreadCount">0</span>
          <div class="small">Notifikasi baru</div>
        </div>
      </div>

      <div class="toolbar">
        <button class="primary" id="refreshButton" type="button">
          ↻ Perbarui
        </button>
        <button class="secondary" id="readAllButton" type="button">
          Tandai sudah dibaca
        </button>
        <button class="secondary" id="logoutButton" type="button">
          Logout
        </button>
      </div>

      <p class="small" id="lastUpdated">
        Menunggu data pesanan...
      </p>

      <div id="notificationMessage" class="message" hidden></div>
      <div id="notificationList" class="notification-list"></div>
    </section>
  </main>

  <footer>
    Cake Order · Sweet Moment, Better Together
  </footer>

  <script>
    const API_BASE =
      "https://cake-order-backend.sabrinaayukartika.workers.dev";

    const TOKEN_KEY = "cakeOrderCashierToken";
    const READ_KEY = "cakeOrderReadNotifications";

    const loginSection = document.getElementById("loginSection");
    const notificationSection =
      document.getElementById("notificationSection");
    const loginForm = document.getElementById("loginForm");
    const loginError = document.getElementById("loginError");
    const notificationList = document.getElementById("notificationList");
    const notificationMessage =
      document.getElementById("notificationMessage");
    const unreadCount = document.getElementById("unreadCount");
    const lastUpdated = document.getElementById("lastUpdated");

    let refreshTimer = null;
    let isLoading = false;
    let knownOrderIds = new Set();
    let firstLoad = true;

    function getToken() {
      return localStorage.getItem(TOKEN_KEY);
    }

    function getReadIds() {
      try {
        return JSON.parse(localStorage.getItem(READ_KEY) || "[]");
      } catch {
        return [];
      }
    }

    function saveReadIds(ids) {
      localStorage.setItem(READ_KEY, JSON.stringify([...ids]));
    }

    async function apiRequest(path, options = {}) {
      const headers = {
        ...(options.body ? { "Content-Type": "application/json" } : {}),
        ...(getToken()
          ? { "Authorization": "Bearer " + getToken() }
          : {}),
        ...options.headers
      };

      const response = await fetch(API_BASE + path, {
        ...options,
        headers
      });

      let result = {};
      try {
        result = await response.json();
      } catch {
        throw new Error("Server tidak mengirim respons JSON yang valid.");
      }

      if (!response.ok || result.success === false) {
        if (response.status === 401 || response.status === 403) {
          localStorage.removeItem(TOKEN_KEY);
        }

        throw new Error(
          result.message || "Permintaan gagal (" + response.status + ")."
        );
      }

      return result;
    }

    function extractToken(result) {
      return result.token ||
        result.access_token ||
        result.data?.token ||
        result.data?.access_token ||
        result.data?.cashier?.token ||
        null;
    }

    function extractOrders(result) {
      if (Array.isArray(result)) return result;
      if (Array.isArray(result.orders)) return result.orders;
      if (Array.isArray(result.data)) return result.data;
      if (Array.isArray(result.data?.orders)) return result.data.orders;
      return null;
    }

    function orderId(order) {
      return String(order.id ?? order.order_code ?? order.code ?? "");
    }

    function formatMoney(value) {
      return new Intl.NumberFormat("id-ID", {
        style: "currency",
        currency: "IDR",
        maximumFractionDigits: 0
      }).format(Number(value) || 0);
    }

    function formatDate(value) {
      if (!value) return "Waktu tidak tersedia";

      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);

      return date.toLocaleString("id-ID", {
        dateStyle: "medium",
        timeStyle: "short"
      });
    }

    function statusLabel(status, paymentStatus) {
      const payment = String(paymentStatus || "").toLowerCase();
      const state = String(status || "").toLowerCase();

      if (payment === "reported_paid" ||
          state === "awaiting_verification") {
        return "Menunggu verifikasi pembayaran";
      }

      if (state === "pending_payment") return "Menunggu pembayaran";
      if (state === "processing") return "Sedang diproses";
      if (state === "completed") return "Selesai";
      if (state === "cancelled") return "Dibatalkan";

      return status || "Status tidak tersedia";
    }

    function showMessage(message) {
      notificationMessage.textContent = message;
      notificationMessage.hidden = false;
    }

    function hideMessage() {
      notificationMessage.hidden = true;
      notificationMessage.textContent = "";
    }

    function makeElement(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    function renderOrders(orders) {
      notificationList.replaceChildren();

      if (orders.length === 0) {
        notificationList.append(
          makeElement(
            "div",
            "empty",
            "Belum ada pesanan. Notifikasi akan muncul ketika pesanan masuk."
          )
        );
        unreadCount.textContent = "0";
        return;
      }

      const readIds = new Set(getReadIds());
      let unread = 0;

      for (const order of orders) {
        const id = orderId(order);
        const isRead = readIds.has(id);

        if (!isRead) unread++;

        const card = makeElement(
          "article",
          "notification" + (isRead ? "" : " unread")
        );

        const top = makeElement("div", "notification-top");
        top.append(
          makeElement(
            "div",
            "order-code",
            "Pesanan #" + (order.order_code || order.code || order.id || "-")
          ),
          makeElement(
            "span",
            "status",
            statusLabel(order.status, order.payment_status)
          )
        );

        const details = makeElement("div", "details");

        const customer = makeElement("div");
        customer.append(
          makeElement("span", "detail-label", "Nama pelanggan"),
          makeElement(
            "span",
            "detail-value",
            order.customer_name || order.name || "-"
          )
        );

        const total = makeElement("div");
        total.append(
          makeElement("span", "detail-label", "Total pesanan"),
          makeElement(
            "span",
            "detail-value",
            formatMoney(order.total_amount ?? order.total)
          )
        );

        const payment = makeElement("div");
        payment.append(
          makeElement("span", "detail-label", "Pembayaran"),
          makeElement(
            "span",
            "detail-value",
            order.payment_status || "Belum tersedia"
          )
        );

        const date = makeElement("div");
        date.append(
          makeElement("span", "detail-label", "Waktu pesanan"),
          makeElement(
            "span",
            "detail-value",
            formatDate(order.created_at || order.createdAt)
          )
        );

        details.append(customer, total, payment, date);

        const bottom = makeElement("div", "notification-footer");
        bottom.append(
          makeElement(
            "span",
            "time",
            isRead ? "Sudah dibaca" : "● Notifikasi baru"
          )
        );

        const readButton = makeElement(
          "button",
          "secondary",
          isRead ? "Sudah dibaca" : "Tandai dibaca"
        );
        readButton.type = "button";
        readButton.disabled = isRead;

        readButton.addEventListener("click", () => {
          const updated = new Set(getReadIds());
          updated.add(id);
          saveReadIds(updated);
          renderOrders(orders);
        });

        bottom.append(readButton);
        card.append(top, details, bottom);
        notificationList.append(card);
      }

      unreadCount.textContent = String(unread);
    }

    async function loadNotifications() {
      if (isLoading || !getToken()) return;

      isLoading = true;
      document.getElementById("refreshButton").disabled = true;

      try {
        const result = await apiRequest("/api/cashier/orders");
        const orders = extractOrders(result);

        if (!orders) {
          throw new Error(
            "Format respons pesanan belum dikenali. Periksa format JSON Worker."
          );
        }

        const currentIds = new Set(orders.map(orderId).filter(Boolean));

        if (!firstLoad) {
          const newIds = [...currentIds].filter(
            id => !knownOrderIds.has(id)
          );

          if (newIds.length > 0) {
            showMessage(
              "🔔 Ada " + newIds.length +
              " pesanan baru masuk!"
            );

            if ("Notification" in window &&
                Notification.permission === "granted") {
              new Notification("Pesanan baru Cake Order", {
                body: newIds.length + " pesanan baru telah masuk."
              });
            }
          }
        } else {
          firstLoad = false;
        }

        knownOrderIds = currentIds;

        // Pesanan terbaru ditampilkan di bagian atas.
        orders.sort((a, b) => {
          const dateA = new Date(a.created_at || a.createdAt || 0);
          const dateB = new Date(b.created_at || b.createdAt || 0);
          return dateB - dateA;
        });

        renderOrders(orders);
        lastUpdated.textContent =
          "Terakhir diperbarui: " +
          new Date().toLocaleTimeString("id-ID");

      } catch (error) {
        showMessage(error.message);

        if (!getToken()) {
          stopRefresh();
          notificationSection.hidden = true;
          loginSection.hidden = false;
        }
      } finally {
        isLoading = false;
        document.getElementById("refreshButton").disabled = false;
      }
    }

    function startRefresh() {
      stopRefresh();
      notificationSection.hidden = false;
      loginSection.hidden = true;
      loadNotifications();
      refreshTimer = setInterval(loadNotifications, 10000);
    }

    function stopRefresh() {
      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = null;
    }

    loginForm.addEventListener("submit", async event => {
      event.preventDefault();
      loginError.textContent = "";

      const button = loginForm.querySelector("button");
      button.disabled = true;
      button.textContent = "Memproses...";

      try {
        const result = await apiRequest("/api/auth/login", {
          method: "POST",
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value
          })
        });

        const token = extractToken(result);

        if (!token) {
          throw new Error(
            "Login berhasil diproses, tetapi token tidak ditemukan pada respons. " +
            "Sesuaikan extractToken() dengan format respons Worker."
          );
        }

        localStorage.setItem(TOKEN_KEY, token);
        firstLoad = true;
        knownOrderIds = new Set();

        if ("Notification" in window &&
            Notification.permission === "default") {
          Notification.requestPermission().catch(() => {});
        }

        startRefresh();

      } catch (error) {
        loginError.textContent = error.message;
      } finally {
        button.disabled = false;
        button.textContent = "Login";
      }
    });

    document.getElementById("refreshButton")
      .addEventListener("click", loadNotifications);

    document.getElementById("readAllButton")
      .addEventListener("click", async () => {
        try {
          const result = await apiRequest("/api/cashier/orders");
          const orders = extractOrders(result);

          if (!orders) throw new Error("Format data pesanan tidak dikenali.");

          const ids = new Set(getReadIds());
          orders.forEach(order => {
            const id = orderId(order);
            if (id) ids.add(id);
          });

          saveReadIds(ids);
          renderOrders(orders);
          hideMessage();
        } catch (error) {
          showMessage(error.message);
        }
      });

    document.getElementById("logoutButton")
      .addEventListener("click", async () => {
        stopRefresh();

        try {
          await apiRequest("/api/auth/logout", { method: "POST" });
        } catch {
          // Token tetap dihapus meskipun endpoint logout gagal.
        }

        localStorage.removeItem(TOKEN_KEY);
        knownOrderIds = new Set();
        firstLoad = true;
        notificationSection.hidden = true;
        loginSection.hidden = false;
      });

    // Jika token login masih tersimpan, langsung buka notifikasi.
    if (getToken()) {
      startRefresh();
    }
  </script>
</body>
    </html>
